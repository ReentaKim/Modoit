[package]
name = "modoit"
version = "0.4.0"
description = "Notes + Stickies memo app"
authors = ["ReentaKim"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ReentaKim/Modoit"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modoit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
notify = "8.2.1"
trash = "5.3.0"
window-vibrancy = "0.8.1"
tauri-nspanel = "2.1.1"
serde_yaml_ng = "0.10"
base64 = "0.22"
libc = "0.2"
objc2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
